<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Book of Ra — Admin</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0f;color:#e8d5a3;font-family:'Segoe UI',sans-serif;min-height:100vh}

    #login{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1.2rem}
    #login h1{font-size:1.8rem;color:#ffd700;letter-spacing:.15em}
    #login input{background:#1a1a2e;border:1px solid #ffd70066;color:#fff;padding:.7em 1.2em;border-radius:.4em;font-size:1rem;width:260px;outline:none}
    #login input:focus{border-color:#ffd700}
    #login button{background:#ffd700;color:#000;border:none;padding:.7em 2em;border-radius:.4em;font-size:1rem;font-weight:700;cursor:pointer}
    .err-msg{color:#ff4444;font-size:.9rem;min-height:1.2em}

    #panel{display:none;max-width:740px;margin:0 auto;padding:2rem 1rem 4rem}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid #ffd70033}
    header h1{font-size:1.3rem;color:#ffd700;letter-spacing:.1em}
    #conn{font-size:.8rem;padding:.25em .75em;border-radius:2em;background:#333;transition:background .3s}
    #conn.ok{background:#1a4a1a;color:#4dff4d}
    #conn.err{background:#4a1a1a;color:#ff4d4d}

    .card{background:#111122;border:1px solid #ffd70022;border-radius:.7em;padding:1.4rem;margin-bottom:1.4rem}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
    .card h2{font-size:.9rem;color:#ffd700;letter-spacing:.1em;text-transform:uppercase}

    .sym-row{display:grid;grid-template-columns:110px 1fr 38px 52px;align-items:center;gap:.6rem;margin-bottom:.6rem}
    .sym-row label{font-size:.83rem;color:#c8b080}
    .sym-row input[type=range]{accent-color:#ffd700;cursor:pointer}
    .sym-row .val{text-align:right;font-size:.9rem;color:#fff;font-weight:700}
    .sym-row .pct{text-align:right;font-size:.75rem;color:#888}

    .btn{border:none;padding:.8em 1em;border-radius:.45em;font-size:.9rem;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:transform .1s,filter .1s;width:100%}
    .btn:hover{filter:brightness(1.15)}
    .btn:active{transform:scale(.96)}
    .btn-sm{padding:.5em .9em;font-size:.82rem;width:auto}
    .btn-reset{background:#2a1a00;color:#ffaa44;border:1px solid #ffaa4444}
    .btn-green {background:#0d3d1a;color:#44ff88;border:1px solid #44ff8844}
    .btn-gold  {background:#3d2a00;color:#ffd700;border:1px solid #ffd70044}
    .btn-purple{background:#2a0d3d;color:#cc88ff;border:1px solid #cc88ff44}
    .btn-red   {background:#3d0d0d;color:#ff6666;border:1px solid #ff666644}

    .evt-grid{display:flex;flex-direction:column;gap:.75rem}

    #symPickerWrap{display:none;margin-top:.8rem;padding:.9rem;background:#0a0a1a;border-radius:.5em;border:1px solid #ffd70022}
    #symPickerWrap label{display:block;font-size:.8rem;color:#888;margin-bottom:.5rem}
    #symPicker{display:flex;flex-wrap:wrap;gap:.5rem}
    .sym-opt{background:#1a1a2e;border:1px solid #ffd70033;color:#e8d5a3;padding:.4em .8em;border-radius:.3em;cursor:pointer;font-size:.85rem;transition:background .15s}
    .sym-opt:hover{background:#2a2a4e}
    .sym-opt.active{background:#3d2a00;border-color:#ffd700;color:#ffd700}

    #status{text-align:center;font-size:.85rem;color:#888;min-height:1.4em;margin-top:.8rem;transition:color .2s}
    #status.ok{color:#44ff88}
    #status.fail{color:#ff4444}
  </style>
</head>
<body>

<div id="login">
  <h1>⚙ ADMIN</h1>
  <input type="password" id="pw" placeholder="Passwort"
         onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">Einloggen</button>
  <div class="err-msg" id="loginErr"></div>
</div>

<div id="panel">
  <header>
    <h1>📊 Book of Ra — Admin</h1>
    <span id="conn" class="err">⬤ Offline</span>
  </header>

  <div class="card">
    <div class="card-header">
      <h2>🎰 Symbol-Wahrscheinlichkeiten</h2>
      <button class="btn btn-sm btn-reset" onclick="resetWeights()">↺ Reset</button>
    </div>
    <div id="sliders"></div>
    <div style="text-align:right;font-size:.75rem;color:#555;margin-top:.4rem">
      Summe immer 100% · Schieber passen sich automatisch an
    </div>
  </div>

  <div class="card">
    <h2 style="margin-bottom:1rem">⚡ Nächster Spin</h2>
    <div class="evt-grid">

      <button class="btn btn-green" onclick="setEvent('normal')">
        🎲 Normal (kein Event aktiv)
      </button>

      <button class="btn btn-gold" onclick="setEvent('threeBooks')">
        📖 3 Bücher — zufällig auf 3 zufälligen Walzen / Reihen
      </button>

      <div>
        <button class="btn btn-purple" onclick="toggleSymPicker()">
          🌟 Ganzer Spin = bestimmtes Symbol ▾
        </button>
        <div id="symPickerWrap">
          <label>Symbol auswählen:</label>
          <div id="symPicker"></div>
        </div>
      </div>

      <button class="btn btn-red" onclick="setEvent('legendary')">
        🏆 Zufällig aussehender Legendary Win
      </button>

    </div>
  </div>

  <div id="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CFG = {
  apiKey:            "AIzaSyDIbryLvdVvLnsCH72fmNQd_yCTNJdGAsA",
  authDomain:        "book-of-ra-rtp-host.firebaseapp.com",
  databaseURL:       "https://book-of-ra-rtp-host-default-rtdb.firebaseio.com",
  projectId:         "book-of-ra-rtp-host",
  storageBucket:     "book-of-ra-rtp-host.firebasestorage.app",
  messagingSenderId: "945474695262",
  appId:             "1:945474695262:web:417b17edc298df232c04cf"
};
const ADMIN_PW = "bora2024admin";

const SYMBOLS = [
  {id:'book',  label:'📖 Buch',      def:2},
  {id:'exp',   label:'🧭 Forscher',  def:3},
  {id:'isis',  label:'👸 Isis',      def:4},
  {id:'scarab',label:'🪲 Skarabäus', def:5},
  {id:'A',     label:'🃏 Ass',       def:6},
  {id:'K',     label:'🃏 König',     def:7},
  {id:'Q',     label:'🃏 Dame',      def:9},
  {id:'J',     label:'🃏 Bube',      def:11},
  {id:'ten',   label:'🃏 10',        def:18},
];
const DEFAULT_W = {};
SYMBOLS.forEach(s => DEFAULT_W[s.id] = s.def);

let db, ref;
let W = {...DEFAULT_W};
let forceSym = null;

function doLogin() {
  if (document.getElementById('pw').value !== ADMIN_PW) {
    document.getElementById('loginErr').textContent = 'Falsches Passwort';
    return;
  }
  document.getElementById('login').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  buildSliders();
  buildSymPicker();
  initFirebase();
}

function initFirebase() {
  firebase.initializeApp(FIREBASE_CFG);
  db  = firebase.database();
  ref = db.ref('gameConfig');

  ref.once('value').then(snap => {
    if (!snap.exists()) ref.set({ weights: DEFAULT_W, nextSpin: 'normal', forceWild: null });
  });

  ref.on('value', snap => {
    document.getElementById('conn').textContent = '⬤ Live';
    document.getElementById('conn').className   = 'ok';
    const d = snap.val();
    if (d?.weights) { W = {...DEFAULT_W, ...d.weights}; renderSliders(); }
  }, () => {
    document.getElementById('conn').textContent = '⬤ Offline';
    document.getElementById('conn').className   = 'err';
  });
}

function buildSliders() {
  const c = document.getElementById('sliders');
  c.innerHTML = '';
  SYMBOLS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'sym-row';
    row.innerHTML = `
      <label>${s.label}</label>
      <input type="range" id="sl_${s.id}" min="1" max="60" value="${W[s.id]}"
             oninput="moveSlider('${s.id}',+this.value)">
      <span class="val" id="vl_${s.id}">${W[s.id]}</span>
      <span class="pct" id="pc_${s.id}"></span>`;
    c.appendChild(row);
  });
  recalcPct();
}

function renderSliders() {
  SYMBOLS.forEach(s => {
    const sl = document.getElementById('sl_'+s.id);
    const vl = document.getElementById('vl_'+s.id);
    if (sl) { sl.value = W[s.id]; vl.textContent = W[s.id]; }
  });
  recalcPct();
}

function moveSlider(id, newVal) {
  const oldVal = W[id];
  const delta  = newVal - oldVal;
  if (delta === 0) return;

  const othersTotal = SYMBOLS.reduce((sum, s) => s.id===id ? sum : sum+W[s.id], 0);
  if (othersTotal <= 0) return;

  SYMBOLS.forEach(s => {
    if (s.id === id) return;
    const adj = W[s.id] - delta * (W[s.id] / othersTotal);
    W[s.id] = Math.max(1, Math.round(adj));
  });
  W[id] = newVal;

  renderSliders();
  pushWeights();
}

function recalcPct() {
  const total = SYMBOLS.reduce((s,sym) => s+W[sym.id], 0);
  SYMBOLS.forEach(s => {
    const el = document.getElementById('pc_'+s.id);
    if (el) el.textContent = (W[s.id]/total*100).toFixed(1)+'%';
  });
}

function resetWeights() {
  W = {...DEFAULT_W};
  renderSliders();
  if (ref) ref.update({weights: W})
    .then(() => showStatus('✓ Auf Original zurückgesetzt','ok'))
    .catch(e => showStatus('❌ '+e.message,'fail'));
}

let _pt = null;
function pushWeights() {
  clearTimeout(_pt);
  _pt = setTimeout(() => {
    if (!ref) return;
    ref.update({weights: W})
      .then(() => showStatus('✓ Live übertragen','ok'))
      .catch(e => showStatus('❌ '+e.message,'fail'));
  }, 350);
}

function setEvent(type) {
  if (!ref) { showStatus('❌ Nicht verbunden','fail'); return; }
  const payload = { nextSpin: type, forceWild: forceSym };

  if (type === 'forceSym') {
    if (!forceSym) { showStatus('Bitte erst Symbol auswählen','fail'); return; }
    payload.forceWild = forceSym;
  }

  ref.update(payload)
    .then(() => showStatus(`✓ Event gesetzt: ${type}`,'ok'))
    .catch(e => showStatus('❌ '+e.message,'fail'));

  if (type !== 'normal') setTimeout(() => ref?.update({nextSpin:'normal',forceWild:null}), 12000);
}

function buildSymPicker() {
  const wrap = document.getElementById('symPicker');
  SYMBOLS.filter(s => s.id !== 'book').forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'sym-opt';
    btn.textContent = s.label;
    btn.dataset.id  = s.id;
    btn.onclick = () => selectSym(s.id, btn);
    wrap.appendChild(btn);
  });
}

function toggleSymPicker() {
  const w = document.getElementById('symPickerWrap');
  w.style.display = w.style.display === 'block' ? 'none' : 'block';
}

function selectSym(id, btn) {
  document.querySelectorAll('.sym-opt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  forceSym = id;
  setEvent('forceSym');
}

function showStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent=''; el.className=''; }, 3000);
}
</script>
</body>
</html>
